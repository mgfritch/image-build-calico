---
name: 'Update BCI base image digest'

# Pipeline 1 - intra-stream runtime CVE refresh (auto-merge).
# Refreshes the pinned bci-minimal (runtime) digest WITHIN the configured
# runtime stream tag (image.bci.runtime.tag, e.g. "16.0"). It never advances
# the minor stream. Gated by trivy so it only opens when the runtime image has
# a real security improvement, then auto-merges after CI.
#
# bci-base is a build-only image: its OS packages never ship in the final
# image, so it is not digest-pinned or CVE-gated here. It stays on a floating
# stream tag and is only advanced to a new minor by Pipeline 2.

sources:
  runtime_current_digest:
    name: Get current BCI runtime base image reference from Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: BCI_RUNTIME_IMAGE
  runtime_digest:
    name: Get latest BCI runtime base image digest for configured stream tag
    kind: dockerdigest
    spec:
      image: '{{ .image.bci.runtime.name }}'
      tag: '{{ .image.bci.runtime.tag }}'

conditions:
  cve_gate:
    name: Update only if the candidate runtime image has fewer HIGH/CRITICAL OS CVEs
    kind: shell
    disablesourceinput: true
    spec:
      command: './updatecli/scripts/should-update-bci-digest.sh "{{ source "runtime_current_digest" }}" "{{ .image.bci.runtime.name }}:{{ source "runtime_digest" }}" "{{ .image.bci.runtime.tag }}"'

targets:
  runtime_dockerfile:
    name: 'Update BCI runtime base image digest in Dockerfile'
    kind: dockerfile
    scmid: default
    sourceid: runtime_digest
    transformers:
      - addprefix: '{{ .image.bci.runtime.name }}:'
    spec:
      file: 'Dockerfile'
      instruction:
        keyword: 'ARG'
        matcher: 'BCI_RUNTIME_IMAGE'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ requiredEnv "GITHUB_REPOSITORY_OWNER" }}'
      repository: '{{ requiredEnv "UPDATECLI_GITHUB_REPO" }}'
      branch: '{{ requiredEnv "UPDATECLI_GITHUB_BRANCH" }}'

actions:
  default:
    title: 'Update BCI base image digest'
    kind: github/pullrequest
    scmid: default
    spec:
      description:
        <h3>Update BCI runtime base image digest</h3>
        <ul>
          <li>{{ .image.bci.runtime.name }}:{{ source "runtime_digest" }}</li>
        </ul>
      labels:
        - chore
        - skip-changelog
        - status/auto-created
      merge:
        strategy: auto
      mergemethod: squash

---
name: 'Update BCI base image tag'

# Pipeline 2 - new minor stream advance (manual review).
# Advances both images to the highest GA (generally available) minor stream
# (e.g. 16.0 -> 16.1) once it leaves beta. The target stream is resolved by
# updatecli/scripts/latest-ga-stream.sh, which skips beta/tech-preview streams
# (com.suse.supportlevel=techpreview / com.suse.eula=sle-beta); the registry
# `latest` tag cannot be used because it points at the previous GA major
# (15.7). bci-base (build-only) is moved to the new FLOATING stream tag with no
# digest, while the bci-minimal (runtime) image is pinned to the new stream's
# digest. Both values.yaml stream tags are bumped so Pipeline 1 subsequently
# tracks runtime digests on the new stream. No CVE gate: it must open
# regardless of any CVE delta.

sources:
  build_tag:
    name: Get latest GA (non-beta) BCI build base image stream tag
    kind: shell
    spec:
      command: './updatecli/scripts/latest-ga-stream.sh {{ .image.bci.build.name }}'

  runtime_tag:
    name: Get latest GA (non-beta) BCI runtime base image stream tag
    kind: shell
    spec:
      command: './updatecli/scripts/latest-ga-stream.sh {{ .image.bci.runtime.name }}'
  runtime_digest:
    name: Get latest BCI runtime base image digest for stream tag
    kind: dockerdigest
    dependson:
      - runtime_tag
    spec:
      image: '{{ .image.bci.runtime.name }}'
      tag: '{{ source "runtime_tag" }}'

conditions:
  new_ga_stream:
    name: Only advance when the GA stream differs from the configured stream
    kind: shell
    disablesourceinput: true
    spec:
      # Proceed only when the resolved GA stream tag is not already the
      # configured stream (values.yaml image.bci.build.tag). This keeps the
      # pipeline a no-op - and opens no PR - while the next minor is still
      # beta (e.g. it stays on 16.0 and does not propose the 16.1 beta).
      command: 'test "{{ source "build_tag" }}" != "{{ .image.bci.build.tag }}"'

targets:
  build_dockerfile:
    name: 'Update BCI build base image tag in Dockerfile'
    kind: dockerfile
    scmid: default
    sourceid: build_tag
    transformers:
      - addprefix: '{{ .image.bci.build.name }}:'
    spec:
      file: 'Dockerfile'
      instruction:
        keyword: 'ARG'
        matcher: 'BCI_BUILD_IMAGE'
  build_values:
    name: 'Update BCI build base image tag in values.yaml'
    kind: yaml
    scmid: default
    sourceid: build_tag
    spec:
      file: 'updatecli/values.yaml'
      key: '$.image.bci.build.tag'
  runtime_dockerfile:
    name: 'Update BCI runtime base image digest in Dockerfile'
    kind: dockerfile
    scmid: default
    sourceid: runtime_digest
    transformers:
      - addprefix: '{{ .image.bci.runtime.name }}:'
    spec:
      file: 'Dockerfile'
      instruction:
        keyword: 'ARG'
        matcher: 'BCI_RUNTIME_IMAGE'
  runtime_values:
    name: 'Update BCI runtime base image tag in values.yaml'
    kind: yaml
    scmid: default
    sourceid: runtime_tag
    spec:
      file: 'updatecli/values.yaml'
      key: '$.image.bci.runtime.tag'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ requiredEnv "GITHUB_REPOSITORY_OWNER" }}'
      repository: '{{ requiredEnv "UPDATECLI_GITHUB_REPO" }}'
      branch: '{{ requiredEnv "UPDATECLI_GITHUB_BRANCH" }}'

actions:
  default:
    title: 'Update BCI base image tag'
    kind: github/pullrequest
    scmid: default
    spec:
      description:
        <h3>Update BCI base image tag</h3>
        <ul>
          <li>{{ .image.bci.build.name }}:{{ source "build_tag" }}</li>
          <li>{{ .image.bci.runtime.name }}:{{ source "runtime_tag" }}</li>
        </ul>
      labels:
        - chore
        - skip-changelog
        - status/auto-created
      merge:
        strategy: manual
      mergemethod: squash
